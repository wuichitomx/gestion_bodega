<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background-color: white;}
        #reader { width: 100%; max-width: 420px; border: none; }
        #result { font-weight: bold; color: green; margin-top: 10px; font-size: 18px; font-family: sans-serif; text-align: center;}
    </style>
</head>
<body>
    <div id="reader"></div>
    <p id="result">Iniciando cámara...</p>

    <script>
        let scanningDone = false;

        function onRender(event) {
            Streamlit.setFrameHeight(450);
        }
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        Streamlit.setComponentReady();

        function onScanSuccess(decodedText, decodedResult) {
            if (scanningDone) return;
            scanningDone = true;
            
            document.getElementById('result').innerText = "¡Código detectado: " + decodedText + "!";
            
            // ¡LA MAGIA! Envía el código directamente al motor de Python de tu app
            Streamlit.setComponentValue(decodedText);
            
            // Pausa de 3 segundos para que Python trabaje, y luego resetea la cámara
            setTimeout(() => {
                scanningDone = false;
                document.getElementById('result').innerText = "Listo para escanear otro código...";
                Streamlit.setComponentValue(null);
            }, 3000);
        }

        const config = {
            fps: 30,
            qrbox: { width: 350, height: 120 },
            aspectRatio: 1.0,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.UPC_A
            ]
        };

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
        html5QrcodeScanner.render(onScanSuccess, (error) => {});
    </script>
</body>
</html>
